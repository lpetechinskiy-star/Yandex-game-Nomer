<!-- Референс-прототип. Встроенные base64-картинки машин удалены: они из чужой игры и в проект не берутся. -->
<title>Номерной Перекуп</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: белая шапка с названием, слева меню разделов (активный пункт — синяя плашка), справа серая рабочая область со страницами */
:root{
  --bg:#f4f2ed; --side:#fffdf9; --card:#ffffff; --line:#e4dfd4; --ink:#1c1e22; --muted:#7b776f;
  --blue:#2457c5; --blue-d:#1b4299; --blue-l:#e2eafa; --blue-ll:#eef3fc; --green:#1f7a45; --green-d:#185f36; --gold:#ffc928; --gold-d:#d9a400;
  --t0:#7a8594; --t1:#2f8f5b; --t2:#2457c5; --t3:#7c4dd8; --t4:#e38a00;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-plate:"M PLUS Rounded 1c","Arial Rounded MT Bold","Arial",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.4;padding-block:0;background:radial-gradient(circle at 1px 1px,rgba(28,30,34,.06) 1px,transparent 0) 0 0/18px 18px,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #8db3ec;outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}

.top{background:#fff;border-bottom:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center;position:relative}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.mute{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 70px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.nav{display:flex;align-items:center;gap:14px;border:0;background:transparent;border-radius:10px;padding:12px 14px;font-size:17px;font-weight:700;text-align:left;line-height:1.2;position:relative}
.nav:hover{background:#f3f5f8}
.nav svg{width:24px;height:24px;flex:none}
.nav .lbl{flex:1;min-width:0}
.nav.on{background:linear-gradient(180deg,#3d7bd3,var(--blue));color:#fff;box-shadow:0 4px 10px rgba(49,112,201,.3)}
.cnt{min-width:30px;height:30px;border-radius:999px;background:#e6e6e6;color:var(--ink);display:grid;place-items:center;font-size:13px;font-weight:800;padding:0 8px}
.nav.on .cnt{background:#24539a;color:#fff}
.cnt.hot{background:#e9f6ee;color:var(--green)}
.content{padding:24px 28px 48px;padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left,0px));gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;scrollbar-width:none}
  .nav{flex-direction:column;gap:4px;font-size:12px;padding:8px 10px;flex:none;text-align:center}
  .nav svg{width:22px;height:22px}
  .cnt{position:absolute;top:2px;right:2px;min-width:20px;height:20px;font-size:10px;padding:0 5px}
  .content{padding:16px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px))}
  .top{padding-block:14px}.top h1{font-size:17px}
}

.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.ph h2{margin:0;font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:-.005em;display:flex;align-items:center;gap:12px;margin-right:auto}
.ph h2 svg{width:30px;height:30px;color:var(--blue)}
.wbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:800;font-size:16px;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.wbtn svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--blue-l);color:var(--blue);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
@media (max-width:760px){.ph h2{font-size:19px}.ph h2 svg{width:24px;height:24px}.wbtn{font-size:14px;padding:8px 12px}}

.pw{container-type:inline-size}
.plate{--k:1;position:relative;display:flex;color:#141414;font-family:var(--f-plate);font-weight:800;line-height:1;overflow:hidden;white-space:nowrap;background:#fff;border:.6cqw solid #151515;border-radius:2.6cqw;box-shadow:0 .8cqw 1.8cqw rgba(0,0,0,.2)}
.plate:not(.ru){box-shadow:inset 0 0 0 .8cqw #fff,inset 0 0 0 1.2cqw #151515,0 .8cqw 1.8cqw rgba(0,0,0,.2)}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(172deg,rgba(255,255,255,.5) 0,rgba(255,255,255,0) 40%,rgba(0,0,0,.04) 100%)}
.plate.eu{aspect-ratio:520/112}
.ch{display:inline-block;padding:0 .35cqw;border-radius:1cqw;transition:background .2s;text-shadow:0 .25cqw 0 rgba(255,255,255,.9),0 -.12cqw 0 rgba(0,0,0,.28)}
.ch.ph{color:#c9cdd3;text-shadow:none}
.ch.hit{background:color-mix(in srgb,var(--tier,#fff) 22%,transparent)}
.ch.rolling{animation:roll .09s linear infinite;color:#8a8a8a}
@keyframes roll{0%{transform:translateY(-7%)}50%{transform:translateY(7%)}100%{transform:translateY(-7%)}}
.grp{display:inline-flex;align-items:baseline}
.p-main{display:flex;align-items:center;justify-content:center;flex:1;min-width:0}
.pside{flex:0 0 9.5%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;font-family:var(--f-ui);font-weight:800;font-size:4.2cqw;margin:1.3cqw 0 1.3cqw 1.3cqw;border-radius:1cqw 0 0 1cqw;position:relative;z-index:1}
.plate.ru{background:#151515;border:0;padding:1.2cqw;gap:1.2cqw;border-radius:3.4cqw}
.ru .pan{background:linear-gradient(180deg,#fff 0,#f2f3f3 100%);border-radius:2.3cqw;box-shadow:inset 0 -.5cqw 1cqw rgba(0,0,0,.07)}
.ru .p-main{flex:0 0 74.6%;align-items:baseline;gap:.4cqw;padding:1.6cqw 1cqw 0}
.ru .L{font-size:calc(var(--k)*15cqw)}.ru .D{font-size:calc(var(--k)*19.5cqw)}
.ru .p-reg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;padding-top:.8cqw;min-width:0}
.ru .R{font-size:calc(var(--k)*12.6cqw);padding:0 .3cqw}
.rus{display:flex;align-items:center;gap:1.1cqw;font-size:5.2cqw;letter-spacing:.02em;line-height:1}
.flag-ru{display:inline-block;width:8.4cqw;height:4.3cqw;border:.28cqw solid #151515;background:linear-gradient(#fff 0 33.3%,#1c50c8 33.3% 66.6%,#d52b1e 66.6%)}
.kz .pside{background:#00afca;color:#fff}
.sun{width:4.6cqw;height:4.6cqw;border-radius:50%;background:#fec50c;box-shadow:0 0 0 .6cqw rgba(254,197,12,.35)}
.kz .p-main{font-size:calc(var(--k)*16cqw);gap:3cqw;border-right:.5cqw solid #151515;margin:1.3cqw 0;padding:0 1cqw}
.kz .p-reg{flex:0 0 15%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--k)*13cqw);min-width:0}
.by .pside{color:#111}
.byf{width:6cqw;height:3.8cqw;border:.25cqw solid #111;background:linear-gradient(90deg,#fff 0 18%,transparent 18%),linear-gradient(#c8313e 0 66%,#4aa657 66%)}
.by .p-main{font-size:calc(var(--k)*16cqw);gap:2.6cqw;padding:0 1.6cqw}
.dash{padding:0 .4cqw}
.ua .pside{background:#0057b7;color:#fff}
.uaf{width:6cqw;height:3.8cqw;background:linear-gradient(#0057b7 0 50%,#ffd700 50%);box-shadow:0 0 0 .3cqw #fff}
.ua .p-main{font-size:calc(var(--k)*15.5cqw);gap:2.4cqw;padding:0 1.6cqw}
.de .pside{background:#003399;color:#fff}
.stars{width:5.2cqw;height:5.2cqw;border-radius:50%;border:.7cqw dotted #ffcc00}
.de .p-main{font-size:calc(var(--k)*15.5cqw);gap:2.2cqw;padding:0 1.6cqw}
.seals{display:flex;flex-direction:column;gap:1cqw;align-self:center}
.seals i{display:block;width:5.4cqw;height:5.4cqw;border-radius:50%;background:radial-gradient(circle,#f1f1f1,#bdbdbd);box-shadow:inset 0 0 0 .3cqw #999}
.seals i+i{background:radial-gradient(circle,#f8c76a,#e3962b);box-shadow:inset 0 0 0 .3cqw #b56e12}
.plate.us{aspect-ratio:2/1;flex-direction:column;align-items:center;justify-content:center;border-color:#1e3a8a;border-radius:4cqw;background:linear-gradient(#fff,#eaf1ff);box-shadow:inset 0 0 0 1.2cqw #fff,inset 0 0 0 1.7cqw #1e3a8a,0 .8cqw 1.8cqw rgba(0,0,0,.2)}
.us .state{font-family:var(--f-ui);font-weight:800;font-style:italic;color:#c81e3a;font-size:8.5cqw}
.us .p-main{flex:none;width:86%;font-size:calc(var(--k)*20cqw);gap:4cqw;color:#1e3a8a;margin-top:1cqw}
.us .slogan{font-family:var(--f-ui);font-weight:800;font-size:4.2cqw;color:#1e3a8a;letter-spacing:.18em;margin-top:1.4cqw}
.frame{border:6px solid #3b82f6;border-radius:26px;background:#3b82f6;box-shadow:0 6px 24px rgba(59,130,246,.25)}
.frame .plate{border-radius:20px}
.frame .plate.ru{border-radius:20px}
.frame .pw.small-us{max-width:none}
.frame.flash{animation:flash .9s ease-out}
.frame.shake{animation:shake .5s ease-in-out,flash 1.1s ease-out}
@keyframes flash{40%{box-shadow:0 0 0 8px color-mix(in srgb,var(--tier) 35%,transparent),0 0 60px var(--tier)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-1.5%) rotate(-.8deg)}40%{transform:translateX(1.5%) rotate(.8deg)}60%{transform:translateX(-1%)}80%{transform:translateX(1%)}}

.rar{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--muted);font-size:15px;font-weight:600;margin-bottom:12px}
.rchip{background:var(--blue-ll);color:var(--c);border-radius:8px;padding:6px 12px;font-weight:800}
.rchip.tiny{padding:3px 8px;font-size:12px}
.plate-zone{max-width:640px;margin:0 auto}
.plate-zone.us-zone{max-width:330px}
.tagline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px auto 0;max-width:720px;min-height:30px}
.tagline span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.tagline b{color:var(--t4)}
.tagline small{color:var(--muted);font-weight:600;margin-left:4px}
.tagline .worth{background:var(--blue-ll);border-color:#c9d8ee;color:var(--blue)}
.hintline{color:var(--muted);font-size:14px;font-weight:600;text-align:center;margin:16px 0 0}
.sep{height:1px;background:var(--line);margin:22px 0}
.cash{display:flex;align-items:center;gap:12px;background:var(--blue);color:#fff;border-radius:16px;padding:20px 26px;font-weight:800;font-size:20px;flex-wrap:wrap}
.cash svg{width:26px;height:26px}
.cash .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.cash .free{font-size:13px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.ccard{background:#f2f2f2;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ccard h3{margin:0;font-size:16px;font-weight:700}
.lbtn{border:1px solid #b8cbe8;background:var(--blue-l);color:var(--blue);border-radius:10px;padding:14px 10px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.lbtn:disabled{opacity:.55;cursor:default}
.lbtn.armed{background:#fde8e8;border-color:#f2b4b4;color:#b42318;font-size:15px}
.bbtn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:12px 10px;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:12px}
.bbtn .rg{background:#fff;color:var(--blue);border-radius:6px;padding:2px 9px;font-size:18px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.act{border:0;border-radius:14px;padding:22px 14px;color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:12px}
.act svg{width:26px;height:26px;flex:none}
.act.blue{background:var(--blue)}.act.green{background:var(--green)}
.act:disabled{background:#cfd3d8;color:#8a9099;cursor:default}
.minor{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
.mbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.mbtn:disabled{opacity:.45;cursor:default}
.mbtn.go{border-color:#9fd0b0;background:#e9f6ee;color:var(--green)}
.ad{font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--ink);color:#fff;border-radius:5px;padding:2px 5px}
@media (max-width:760px){
  .cards3{gap:8px}
  .ccard{padding:10px;gap:8px}.ccard h3{font-size:13px}
  .lbtn{font-size:15px;padding:12px 4px}.bbtn{font-size:14px;gap:6px;padding:11px 4px;flex-wrap:wrap}.bbtn .rg{font-size:14px}
  .cash{font-size:16px;padding:16px 18px}.act{font-size:15px;padding:16px 8px}.act svg{width:20px;height:20px}.duo{gap:8px}
}

.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.statbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-weight:700;font-size:14px}
.statbar b{color:var(--blue);font-size:24px;margin:0 4px;font-variant-numeric:tabular-nums}
.statbar span b{font-size:16px}
.empty{text-align:center;padding:90px 16px}
.empty h3{margin:0 0 8px;font-size:24px;font-weight:800}
.empty p{margin:0;color:var(--muted);font-size:17px}
.grid-plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.pw.small-us{width:100%;max-width:150px;margin:0 auto}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .push,.push{margin-left:auto}
.val{font-weight:800;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:13px;font-weight:600}
.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.order.ready{border-color:#9fd0b0;box-shadow:inset 4px 0 0 var(--green)}
.o-buyer{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.o-text{margin:0;font-weight:800;font-size:17px}
.ok{color:var(--green);font-weight:800;font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}

.carbar{display:flex;align-items:center;gap:10px;background:var(--blue);color:#fff;border-radius:12px;padding:10px 12px}
.carbar h3{margin:0;flex:1;text-align:center;font-size:20px;font-weight:800}
.arrow{width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;font-weight:800;line-height:1}
.arrow:disabled{opacity:.35;cursor:default}
.scene{position:relative;margin-top:16px;border-radius:16px;overflow:hidden;background:#9c9c9a}
.scene > svg{display:block;width:100%;height:auto}
.car{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:58%;container-type:inline-size}
.car svg{display:block;width:100%;height:auto}
.mount{position:absolute;left:50%;transform:translateX(-50%)}
.mount.eu{width:31%;top:74.8%}
.mount.us{width:16%;top:72.5%}
.carinfo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 4px}
.carinfo h4{margin:0;font-size:20px;font-weight:800}
.noplate{display:inline-flex;align-items:center;gap:8px;color:#555;font-weight:700}
.noplate i{width:16px;height:16px;border-radius:50%;background:#555;position:relative}
.noplate i::after{content:"";position:absolute;left:4px;right:4px;top:7px;height:2px;background:#fff}
.carplate{width:180px}
.pcard .pw,.pick .pw,.ccountry .pw,.carplate .pw{width:100%}
.carplate .pw.small-us{max-width:90px}
.pick-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.pick{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fafafa}

.tabs2{display:grid;grid-template-columns:1fr 1fr;background:#e4e4e4;border:1px solid var(--line);border-radius:14px;padding:6px;gap:6px}
.tabs2 button{border:0;border-radius:10px;padding:12px;font-weight:800;font-size:18px;background:transparent;color:#555}
.tabs2 button.on{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(49,112,201,.3)}
.rank-card{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:22px;align-items:center;background:linear-gradient(135deg,#fff,#f3f6fb);border:1px solid var(--line);border-radius:18px;padding:22px 26px;margin-top:16px}
.rank-card .lab{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.rank-card h3{margin:2px 0 10px;font-size:32px;font-weight:800}
.prog{height:10px;background:#e3e6ea;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:99px}
.rank-card .sub{color:var(--muted);font-size:14px;font-weight:600;margin-top:8px}
.big-num{text-align:center}
.big-num b{display:block;font-size:34px;color:var(--blue);font-variant-numeric:tabular-nums}
.big-num span{color:var(--muted);font-size:14px;font-weight:600}
@media (max-width:760px){.rank-card{grid-template-columns:70px minmax(0,1fr);padding:16px;gap:14px}.rank-card h3{font-size:24px}.rank-card > svg{width:64px;height:auto}.big-num{grid-column:1 / -1;display:flex;gap:10px;align-items:baseline;justify-content:center}.big-num b{display:inline;font-size:26px}}
.lb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:44px 52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;border-radius:14px}
.lrow.top{color:#fff;padding:0 0 0 14px;grid-template-columns:44px 52px minmax(0,1fr) auto minmax(150px,auto);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.lrow.top.p1{background:linear-gradient(90deg,#1e1c19,#3b3427);border-color:#7a6431}
.lrow.top.p2{background:linear-gradient(90deg,#1f2430,#323a4a)}
.lrow.top.p3{background:linear-gradient(90deg,#2a201d,#45302a);border-color:#6b4637}
.lrow.me:not(.top){background:#fff7dc;outline:2px solid var(--gold)}
.lrow.top.me{outline:3px solid var(--gold)}
.place{font-weight:800;font-size:22px;text-align:center;color:#555}

  const t = e.target.closest("button,[data-close]"); if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined){ if (e.target === t || t.classList.contains("x")){ modal = null; renderModal(); } return; }
  if (d.page){ if (wheelSpinning) return; S.page = d.page; render(); window.scrollTo({top:0}); return; }
  if (d.modal){ modal = d.modal; renderModal(); return; }
  if (t.id === "mute"){ S.muted = !S.muted; render(); return; }
  if (t.id === "spinD") return spinPart("d");
  if (t.id === "spinL") return spinPart("l");
  if (t.id === "adFree") return showAd(() => { S.freeSpins++; toast("+1 бесплатная прокрутка"); });
  if (t.id === "aX2") return showAd(() => { S.x2 = true; toast("Цена номера удвоена"); });
  const ev = evaluate(S.cur);
  if (t.id === "aSell" && ev){ const p = ev.price*(S.x2 ? 2 : 1); S.rub += p; cash(); toast(`Продано за ${money(p)}`); resetCur(); render(); return; }
  if (t.id === "aSave" && ev){ if (S.inv.length >= INV_MAX){ toast("Инвентарь полон. Продайте что-нибудь."); return; }
    S.inv.push({...S.cur, x2:S.x2, id:S.uid++}); S.season.points += ev.score; S.season.saves++; toast(`Сохранено · +${ev.score} очков сезона`); resetCur(); render(); return; }
  if (t.id === "aInstall" && ev && !S.activeCar){ toast("Сначала получите машину в магазине"); S.page = "shop"; render(); return; }
  if (t.id === "aInstall" && ev){ const car = CARS.find(c => c.id === S.activeCar); const pts = Math.round(ev.score*car.cls);
    install(S.activeCar, {...S.cur, x2:S.x2}); S.season.points += pts; S.season.saves++; resetCur(); render(); return; }
  if (d.give && ev){ completeOrder(+d.give); resetCur(); render(); return; }
  if (d.isell){ const i = S.inv.findIndex(x => x.id === +d.isell); if (i >= 0){ const it = S.inv[i], p = evaluate(it).price*(it.x2 ? 2 : 1); S.rub += p; S.inv.splice(i,1); cash(); toast(`Продано за ${money(p)}`); render(); } return; }
  if (d.iinst && !S.activeCar){ toast("Сначала получите машину в магазине"); S.page = "shop"; render(); return; }
  if (d.iinst){ const i = S.inv.findIndex(x => x.id === +d.iinst); if (i >= 0){ const it = S.inv.splice(i,1)[0]; install(S.activeCar, it); render(); } return; }
  if (d.put){ const i = S.inv.findIndex(x => x.id === +d.put); if (i >= 0){ const it = S.inv.splice(i,1)[0]; install(d.car, it); render(); } return; }
  if (d.igive){ const i = S.inv.findIndex(x => x.id === +d.igive); if (i >= 0){ S.inv.splice(i,1); completeOrder(+d.o); render(); } return; }
  if (d.replace){ if (S.rub < REPLACE_COST){ toast("Не хватает денег"); return; } const i = S.orders.findIndex(o => o.id === +d.replace); if (i >= 0){ S.rub -= REPLACE_COST; S.orders.splice(i,1,newOrder()); render(); } return; }
  if (d.gnav){ const n = ownedCars().length; S.garageIdx = (S.garageIdx + +d.gnav + n) % n; render(); return; }
  if (d.active){ S.activeCar = d.active; toast("Номера с экрана создания теперь ставятся на эту машину"); render(); return; }
  if (d.unmount){ if (S.inv.length >= INV_MAX){ toast("В инвентаре нет места"); return; } const s = S.cars[d.unmount]; S.inv.push({...s.plate, id:S.uid++}); s.plate = null; render(); return; }
  if (d.offerad){ const o = OFFERS.find(x => x.id === d.offerad); return showAd(() => {
      if (o.adBonus) S.rub += o.adBonus;
      S.offers[o.id] = (S.offers[o.id] || 0) + 1;
      if (S.offers[o.id] >= o.ads) grantOffer(o); else toast(`Реклама ${S.offers[o.id]}/${o.ads}${o.adBonus ? ` · +${money(o.adBonus)}` : ""}`);
    }); }
  if (d.offerbuy){ const o = OFFERS.find(x => x.id === d.offerbuy); if (S.rub >= o.price){ S.rub -= o.price; grantOffer(o); render(); } return; }
  if (d.buy){ const car = CARS.find(c => c.id === d.buy); if (S.rub >= car.price){ S.rub -= car.price; S.cars[car.id] = {plate:null}; S.activeCar = car.id; S.garageIdx = ownedCars().findIndex(c => c.id === car.id); cash(); toast(`Куплено: ${car.name}`); render(); } return; }
  if (d.buyad){ const id = d.buyad; return showAd(() => { S.cars[id] = {plate:null}; S.activeCar = id; S.garageIdx = ownedCars().findIndex(c => c.id === id); toast("Лада Приора теперь ваша!"); }); }
  if (d.country){
    const nc = COUNTRIES[d.country];
    toast((S.cur.d || S.cur.l) ? `${nc.name}: валюта — ${nc.curName}. Незаконченный номер сброшен.` : `${nc.name}: валюта — ${nc.curName}`);
    S.country = d.country; S.cur = {c:d.country, d:null, l:null, r:ordinaryRegion(nc)}; S.x2 = false; disarm(); modal = null; render(); return;
  }
  if (d.unlock){ const c = COUNTRIES[d.unlock]; if (S.rub >= c.unlock){ S.rub -= c.unlock; S.unlocked.push(c.id); cash(); toast(`Открыта страна: ${c.name}`); render(); } return; }
  if (d.reg !== undefined){
    const c = C(), pr = c.prest[d.reg], cost = pr ? pr.p*REGION_K : 0;
    if (S.cur.r === d.reg){ modal = null; render(); return; }
    if (S.rub < cost){ toast("Не хватает денег на этот регион"); return; }
    S.rub -= cost; S.cur.r = d.reg; modal = null; noteFound(evaluate(S.cur), S.cur); render(); return;
  }
  if (d.rtab){ rateTab = d.rtab; render(); return; }
  if (t.id === "wSpin") return spinWheel();
  if (t.id === "wAd") return showAd(() => { S.wheel.ads = Math.min(2, S.wheel.ads + 1); });
  if (t.id === "bClaim" && bonusReady()){ const v = DAYS[S.bonus.day % 7]; S.rub += v; S.bonus.day = (S.bonus.day % 7) + 1; if (S.bonus.day >= 7) S.bonus.day = 0; S.bonus.last = Date.now(); cash(); toast(`Бонус: +${money(v)}`); render(); return; }
  if (t.id === "bReview" && !S.reviewed){ S.reviewed = true; S.rub += 10000; cash(); toast(`Спасибо за оценку! +${money(10000)}`); render(); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal){ modal = null; renderModal(); } });
setInterval(() => {
  const w = $("wTimer"); if (w){ const left = WHEEL_CD - (Date.now() - S.wheel.last); if (left <= 0) render(); else w.textContent = fmtTime(left); }
  const b = $("bTimer"); if (b){ const left = DAY - (Date.now() - S.bonus.last); if (left <= 0) render(); else b.textContent = fmtTime(left); }
}, 1000);
setInterval(() => { if (!spinning && !wheelSpinning) renderSide(); }, 60000);

noteFound(evaluate(S.cur), S.cur);
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPlates);
window.addEventListener("resize", fitPlates);
})();
</script>
